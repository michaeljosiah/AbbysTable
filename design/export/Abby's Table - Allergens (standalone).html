th><\u002Fsvg><\u002Fa>\n      <a class=\"at-social\" href=\"https://www.facebook.com/fromabbystable/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -10px; transition: opacity .16s ease;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 6.15 11.15\" fill=\"var(--blush)\" style=\"display: block;\"><path d=\"M4.05 11.15V6h1.7l.3-1.95h-2V2.8c0-.55.25-.95 1-.95h1.1V.1A14.6 14.6 0 0 0 4.55 0C2.85 0 1.75 1.05 1.75 2.6v1.45H0V6h1.75v5.15Z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n      <a class=\"at-social\" href=\"https://x.com/fromabbystable\" target=\"_blank\" rel=\"noopener\" aria-label=\"X\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -10px; transition: opacity .16s ease;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"var(--blush)\" style=\"display: block;\"><path d=\"M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { drawer: false, dirDown: false, footOpen: {}, subscribed: false };\n\n  // ---- footer (canonical) ----\n  // Canonical: the footer column heads are accordion BUTTONS on mobile and non-interactive\n  // LABELS from 1024, where the toggle is inert and the chevron is hidden. Without this they stay\n  // focusable buttons announcing aria-expanded at desktop — three collapsible controls that do\n  // nothing. Attributes cannot be swapped in CSS, so the semantics are set here. One element, so\n  // no duplicated markup, and the visual design is untouched.\n  footRef = (el) => {\n    this._foot = el;\n    if (el) this._footSemantics();\n  };\n\n  _footSemantics = () => {\n    if (!this._foot) return;\n    const label = window.innerWidth >= 1024;\n    Array.prototype.forEach.call(this._foot.querySelectorAll(\".at-foot-head\"), (b) => {\n      if (label) {\n        // Captured before the first desktop pass strips them: React only rewrites an attribute\n        // when its value changes, so it will not restore these on the way back to mobile.\n        if (!b.dataset.ctrl) b.dataset.ctrl = b.getAttribute(\"aria-controls\") || \"\";\n        if (!b.dataset.exp) b.dataset.exp = b.getAttribute(\"aria-expanded\") || \"false\";\n        b.removeAttribute(\"aria-expanded\");\n        b.removeAttribute(\"aria-controls\");\n        b.setAttribute(\"role\", \"heading\");\n        b.setAttribute(\"aria-level\", \"3\");\n        b.setAttribute(\"tabindex\", \"-1\");\n      } else {\n        b.removeAttribute(\"role\");\n        b.removeAttribute(\"aria-level\");\n        b.removeAttribute(\"tabindex\");\n        if (b.dataset.ctrl) b.setAttribute(\"aria-controls\", b.dataset.ctrl);\n        if (!b.hasAttribute(\"aria-expanded\")) b.setAttribute(\"aria-expanded\", b.dataset.exp || \"false\");\n      }\n    });\n  };\n\n  _footToggle = (k) => {\n    // Inert at desktop: the columns are already open there and the head is a label, not a control.\n    if (window.innerWidth >= 1024) return;\n    this._footToggleState(k);\n  };\n\n  _footToggleState = (k) => this.setState((s) => {\n    const o = Object.assign({}, s.footOpen);\n    o[k] = !o[k];\n    return { footOpen: o };\n  });\n  toggleShop = () => this._footToggle(\"shop\");\n  toggleLearn = () => this._footToggle(\"learn\");\n  toggleInfo = () => this._footToggle(\"info\");\n  onJoin = (e) => { e.preventDefault(); this.setState({ subscribed: true }); };\n\n  // ---- header ----\n  hdrRef = (el) => { this._hdr = el; };\n\n  _onScroll = () => {\n    const y = window.scrollY;\n    const last = this._lastY || 0;\n    if (Math.abs(y - last) < 8) return;\n    const down = y > last && y > 120;\n    this._lastY = y;\n    if (down && this._hdr && this._hdr.contains(document.activeElement)) return;\n    if (down !== this.state.dirDown) this.setState({ dirDown: down });\n  };\n\n  componentDidMount() {\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    window.addEventListener(\"resize\", this._footSemantics);\n    this._onKey = (ev) => {\n      if (!this.state.drawer) return;\n      if (ev.key === \"Escape\") { ev.preventDefault(); this.close(); return; }\n      if (ev.key === \"Tab\") this.trap(ev);\n    };\n    document.addEventListener(\"keydown\", this._onKey);\n  }\n\n  componentWillUnmount() {\n    // Part of the canonical drawer set: the focus poll is bounded but must not outlive the page.\n    cancelAnimationFrame(this._drawerRaf);\n    clearTimeout(this._drawerTo);\n    document.removeEventListener(\"keydown\", this._onKey);\n    window.removeEventListener(\"scroll\", this._onScroll);\n    window.removeEventListener(\"resize\", this._footSemantics);\n    document.body.style.overflow = \"\";\n  }\n\n  // ---- drawer (canonical) ----\n  // The panel is always mounted under a known id, so it is read from the document rather than\n  // through a ref: ref attach timing was the unreliable part.\n  _drawerPanel = () => this._panel || document.getElementById(\"at-drawer\");\n\n  // Required by _takeDrawerFocus below. This page never defined it, so it comes across with the\n  // canonical block rather than being left as a call to nothing.\n  _canFocus = (el) => !!el && el.offsetParent !== null && getComputedStyle(el).visibility !== \"hidden\";\n\n  // Stable class fields, NOT arrows created inside renderVals(): a ref rebuilt on every render is\n  // detached with null each time, and renderVals() runs on scroll here (header auto-hide), so the\n  // handles were unreliable exactly when open()/close() read them.\n  panelRef = (el) => { this._panel = el; };\n  burgerRef = (el) => { this._burger = el; };\n\n  focusables = () => {\n    const panel = this._drawerPanel();\n    if (!panel) return [];\n    return Array.from(panel.querySelectorAll(\"a[href], button\")).filter((el) => el.offsetParent !== null);\n  };\n\n  // Canonical, from Homepage v2 (build-handoff.md § 3x). Focus moves here rather than in a\n  // lifecycle hook or a setState callback: this runtime calls neither, so a callback-based move\n  // never ran at all. Poll for the panel becoming focusable on BOTH a frame and a timer (a frame\n  // can be throttled, a timer cannot), bounded by 1s of wall clock rather than a frame count — the\n  // old 20-frame budget could expire before the display: none -> flex flip had landed, leaving\n  // focus on the burger with no error. Target is the Close button, a fixed position in the panel.\n  _takeDrawerFocus = () => {\n    cancelAnimationFrame(this._drawerRaf);\n    clearTimeout(this._drawerTo);\n    const start = Date.now();\n    const take = () => {\n      const panel = this._drawerPanel();\n      const btn = panel && panel.querySelector('button[aria-label=\"Close menu\"]');\n      const t = this._canFocus(btn) ? btn : this.focusables()[0];\n      if (t) { t.focus(); return; }\n      if (Date.now() - start < 3000) {\n        this._drawerRaf = requestAnimationFrame(take);\n        this._drawerTo = setTimeout(take, 50);\n      }\n    };\n    take();\n  };\n\n  trap = (e) => {\n    const els = this.focusables();\n    if (!els.length) return;\n    const first = els[0], last = els[els.length - 1];\n    if (this._panel && !this._panel.contains(document.activeElement)) {\n      e.preventDefault();\n      (e.shiftKey ? last : first).focus();\n      return;\n    }\n    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n  };\n\n  open = () => {\n    this.setState({ drawer: true });\n    document.body.style.overflow = \"hidden\";\n    // The panel is always mounted, so focus is taken here rather than in a ref callback. ONE frame\n    // is not enough: the display: none → flex flip has not landed, so focusables() (which filters\n    // on offsetParent) is still empty and no focus is taken. Re-assert each frame until the panel\n    // is laid out, bounded so it cannot spin.\n    this._takeDrawerFocus();\n  };\n\n  close = () => {\n    this.setState({ drawer: false });\n    document.body.style.overflow = \"\";\n    cancelAnimationFrame(this._drawerRaf);\n    clearTimeout(this._drawerTo);\n    if (this._burger) this._burger.focus();\n  };\n\n  renderVals() {\n    return {\n      hdrRef: this.hdrRef,\n      hdrHidden: (this.state.dirDown && !this.state.drawer) ? \"true\" : \"false\",\n      drawerCls: this.state.drawer ? \"is-open\" : \"\",\n      burgerExpanded: this.state.drawer ? \"true\" : \"false\",\n      openDrawer: this.open,\n      closeDrawer: this.close,\n      panelRef: this.panelRef,\n      burgerRef: this.burgerRef,\n      subscribed: !!this.state.subscribed,\n      notSubscribed: !this.state.subscribed,\n      onJoin: this.onJoin,\n      footRef: this.footRef,\n      toggleShop: this.toggleShop,\n      toggleLearn: this.toggleLearn,\n      toggleInfo: this.toggleInfo,\n      shopCls: this.state.footOpen.shop ? \"is-open\" : \"\",\n      learnCls: this.state.footOpen.learn ? \"is-open\" : \"\",\n      infoCls: this.state.footOpen.info ? \"is-open\" : \"\",\n      shopExp: this.state.footOpen.shop ? \"true\" : \"false\",\n      learnExp: this.state.footOpen.learn ? \"true\" : \"false\",\n      infoExp: this.state.footOpen.info ? \"true\" : \"false\",\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
