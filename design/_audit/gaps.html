<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>gap probe</title>
<style>html,body{margin:0;background:#222}iframe{border:0;display:block;transform-origin:top left}</style>
</head>
<body>
<iframe id="a" src="../Abby's Table - Homepage v2.dc.html" style="width:390px;height:3000px;transform:scale(0.25)"></iframe>
<script>
  window.gaps = (w) => {
    const f = document.getElementById('a');
    f.style.width = w + 'px';
    const d = f.contentDocument, win = f.contentWindow;
    const secs = [...d.querySelectorAll('main > section, body > section, x-dc > section, .sc-host > section')];
    const all = secs.length ? secs : [...d.querySelectorAll('section')];
    return all.map(s => {
      const c = win.getComputedStyle(s);
      return [String(s.className).slice(0, 18), c.paddingTop, c.paddingBottom];
    });
  };
</script>
</body>
</html>
