name: Deploy storefront

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/deploy-storefront.yml
  pull_request:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/deploy-storefront.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /web
          api_location: ""
          output_location: ""
        env:
          AONIK_API_URL: ${{ secrets.AONIK_API_URL }}
          AONIK_TENANT_ID: ${{ secrets.AONIK_TENANT_ID }}
          AONIK_DATA_MODE: ${{ secrets.AONIK_DATA_MODE }}
          AONIK_AUTH_CLIENT_ID: ${{ secrets.AONIK_AUTH_CLIENT_ID }}
