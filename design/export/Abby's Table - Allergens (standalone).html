document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"49cfdbf4-681e-41f5-9390-6ffd7e93e75a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Abby's Table — Color tokens\n   Derived from the homepage Figma. A warm, editorial palette:\n   deep Nigerian-greens, brass, terracotta, and toasted creams. */\n\n:root {\n  /* ----- Brand greens ----- */\n  --green-forest: #1E3A2F;   /* primary brand green — headings, top bar, dark CTAs */\n  --green-deep:   #15291F;   /* darkest — footer ground */\n  --green-mid:    #456052;   /* hairline borders on dark, muted dark-surface lines */\n  --green-sage:   #8FA096;   /* muted sage text */\n  --green-mist:   #AEB8B1;   /* lightest sage — disabled / faint UI text */\n\n  /* ----- Accents ----- */\n  --brass:        #C28E3C;   /* gold accent — eyebrows, rules, join button */\n  --brass-deep:   #A9762C;   /* pressed / hover brass */\n  --terracotta:   #B45F5A;   /* rust — primary buttons, accent display text */\n  --terracotta-deep: #96474A;/* pressed terracotta */\n  --navy:         #28365C;   /* private-table section ground */\n\n  /* ----- Toasted neutrals (surfaces) ----- */\n  --cream:        #F7F1E8;   /* page ground */\n  --cream-2:      #F7F2E8;   /* header / standards band */\n  --cream-3:      #FBF8F1;   /* dishes band — lightest cream */\n  --white:        #FFFFFF;\n  --blush:        #E9CDB8;   /* peach — founder band, light-on-dark text */\n  --sand:         #E0D8C8;   /* card surface, hairline borders on light */\n  --sand-2:       #D6D0C6;   /* faint cream text on dark */\n\n  /* ----- Text ----- */\n  --brown:        #3B2C22;   /* primary body text on light */\n  --taupe:        #86755F;   /* secondary / supporting text */\n\n  /* ===================================================================\n     Semantic aliases — prefer these in components\n     =================================================================== */\n\n  /* Surfaces */\n  --surface-page:      var(--cream);\n  --surface-raised:    var(--cream-2);\n  --surface-bright:    var(--cream-3);\n  --surface-card:      var(--sand);\n  --surface-blush:     var(--blush);\n  --surface-dark:      var(--green-forest);\n  --surface-darker:    var(--green-deep);\n  --surface-navy:      var(--navy);\n\n  /* Text */\n  --text-heading:      var(--green-forest);\n  --text-body:         var(--brown);\n  --text-muted:        var(--taupe);\n  --text-on-dark:      var(--blush);\n  --text-on-dark-soft: var(--sand-2);\n  --text-inverse:      var(--white);\n  --text-accent:       var(--terracotta);\n  --text-eyebrow:      var(--brass);\n\n  /* Lines & borders */\n  --border-light:      var(--sand);\n  --border-dark:       var(--green-mid);\n  --rule-brass:        var(--brass);\n\n  /* Interactive */\n  --action-primary:        var(--terracotta);\n  --action-primary-hover:  var(--terracotta-deep);\n  --action-dark:           var(--green-forest);\n  --action-brass:          var(--brass);\n  --action-brass-hover:    var(--brass-deep);\n  --focus-ring:            var(--brass);\n}\n<\u002Fstyle>\n<style>/* Abby's Table — Typography tokens\n   Display = Playfair Display. UI/body = Figtree. Accent = Cormorant Garamond.\n   A signature of the brand is WIDE tracking on small uppercase labels\n   (eyebrows, buttons, nutrition tags). */\n\n:root {\n  /* ----- Families ----- */\n  --font-display: \"Playfair Display\", ui-serif, Georgia, \"Times New Roman\", serif;\n  --font-accent:  \"Cormorant Garamond\", ui-serif, Georgia, serif;\n  --font-sans:    \"Figtree\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* ----- Weights ----- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n\n  /* ----- Display scale (Playfair) ----- */\n  --display-hero:    55px;  /* hero headline */\n  --display-1:       48px;  /* section title — \"The dishes\" */\n  --display-2:       40px;  /* promo heading */\n  --display-3:       22px;  /* card title */\n  --line-display:    1.1;  /* @kind other */\n  --track-display:   -0.01em;\n\n  /* ----- Accent (Cormorant) ----- */\n  --accent-lg:       28px;  /* \"Flavour built from real food…\" */\n  --track-accent:    0.06em;\n\n  /* ----- Body (Figtree) ----- */\n  --body-lg:         16px;\n  --body-md:         15px;\n  --body-sm:         13px;\n  --body-xs:         11px;\n  --line-body:       1.6;   /* @kind other */\n  --line-snug:       1.5;   /* @kind other */\n\n  /* ----- Eyebrow / label (Figtree, uppercase, wide track) ----- */\n  --eyebrow-size:    15px;\n  --eyebrow-sm:      13px;\n  --track-eyebrow:   0.24em;   /* MEET THE FOUNDER, WHAT'S ON THE TABLE? */\n  --track-wide:      0.16em;   /* buttons, nutrition tags */\n  --track-announce:  0.12em;   /* top-bar announcement */\n\n  /* ----- Button text ----- */\n  --btn-size:        14px;\n  --btn-size-sm:     13px;\n}\n<\u002Fstyle>\n<style>/* Abby's Table — Spacing, radii, shadows, layout\n   4px base grid. Pills are fully rounded; cards use an 18px radius;\n   large media blocks use 24px. Shadows are minimal and warm. */\n\n:root {\n  /* ----- Spacing scale (4px grid) ----- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* Section vertical rhythm */\n  --section-pad-y: 96px;\n  --gutter:        80px;   /* page side gutter at 1440 */\n\n  /* ----- Radii ----- */\n  --radius-sm:    12px;\n  --radius-card:  18px;   /* dish cards, images */\ 4, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"fc89540c-3df8-4af7-b66b-e603392d2f76\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"49cfdbf4-681e-41f5-9390-6ffd7e93e75a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d0258bf7-6b65-4fcf-9c7d-ce8c28418458\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3f65b635-7e59-4d79-b384-8cf364b1da08\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fc89540c-3df8-4af7-b66b-e603392d2f76\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"49cfdbf4-681e-41f5-9390-6ffd7e93e75a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Abby's Table — Color tokens\n   Derived from the homepage Figma. A warm, editorial palette:\n   deep Nigerian-greens, brass, terracotta, and toasted creams. */\n\n:root {\n  /* ----- Brand greens ----- */\n  --green-forest: #1E3A2F;   /* primary brand green — headings, top bar, dark CTAs */\n  --green-deep:   #15291F;   /* darkest — footer ground */\n  --green-mid:    #456052;   /* hairline borders on dark, muted dark-surface lines */\n  --green-sage:   #8FA096;   /* muted sage text */\n  --green-mist:   #AEB8B1;   /* lightest sage — disabled / faint UI text */\n\n  /* ----- Accents ----- */\n  --brass:        #C28E3C;   /* gold accent — eyebrows, rules, join button */\n  --brass-deep:   #A9762C;   /* pressed / hover brass */\n  --terracotta:   #B45F5A;   /* rust — primary buttons, accent display text */\n  --terracotta-deep: #96474A;/* pressed terracotta */\n  --navy:         #28365C;   /* private-table section ground */\n\n  /* ----- Toasted neutrals (surfaces) ----- */\n  --cream:        #F7F1E8;   /* page ground */\n  --cream-2:      #F7F2E8;   /* header / standards band */\n  --cream-3:      #FBF8F1;   /* dishes band — lightest cream */\n  --white:        #FFFFFF;\n  --blush:        #E9CDB8;   /* peach — founder band, light-on-dark text */\n  --sand:         #E0D8C8;   /* card surface, hairline borders on light */\n  --sand-2:       #D6D0C6;   /* faint cream text on dark */\n\n  /* ----- Text ----- */\n  --brown:        #3B2C22;   /* primary body text on light */\n  --taupe:        #86755F;   /* secondary / supporting text */\n\n  /* ===================================================================\n     Semantic aliases — prefer these in components\n     =================================================================== */\n\n  /* Surfaces */\n  --surface-page:      var(--cream);\n  --surface-raised:    var(--cream-2);\n  --surface-bright:    var(--cream-3);\n  --surface-card:      var(--sand);\n  --surface-blush:     var(--blush);\n  --surface-dark:      var(--green-forest);\n  --surface-darker:    var(--green-deep);\n  --surface-navy:      var(--navy);\n\n  /* Text */\n  --text-heading:      var(--green-forest);\n  --text-body:         var(--brown);\n  --text-muted:        var(--taupe);\n  --text-on-dark:      var(--blush);\n  --text-on-dark-soft: var(--sand-2);\n  --text-inverse:      var(--white);\n  --text-accent:       var(--terracotta);\n  --text-eyebrow:      var(--brass);\n\n  /* Lines & borders */\n  --border-light:      var(--sand);\n  --border-dark:       var(--green-mid);\n  --rule-brass:        var(--brass);\n\n  /* Interactive */\n  --action-primary:        var(--terracotta);\n  --action-primary-hover:  var(--terracotta-deep);\n  --action-dark:           var(--green-forest);\n  --action-brass:          var(--brass);\n  --action-brass-hover:    var(--brass-deep);\n  --focus-ring:            var(--brass);\n}\n\n/* Abby's Table — Typography tokens\n   Display = Playfair Display. UI/body = Figtree. Accent = Cormorant Garamond.\n   A signature of the brand is WIDE tracking on small uppercase labels\n   (eyebrows, buttons, nutrition tags). */\n\n:root {\n  /* ----- Families ----- */\n  --font-display: \"Playfair Display\", ui-serif, Georgia, \"Times New Roman\", serif;\n  --font-accent:  \"Cormorant Garamond\", ui-serif, Georgia, serif;\n  --font-sans:    \"Figtree\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* ----- Weights ----- */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n\n  /* ----- Display scale (Playfair) ----- */\n  --display-hero:    55px;  /* hero headline */\n  --display-1:       48px;  /* section title — \"The dishes\" */\n  --display-2:       40px;  /* promo heading */\n  --display-3:       22px;  /* card title */\n  --line-display:    1.1;  /* @kind other */\n  --track-display:   -0.01em;\n\n  /* ----- Accent (Cormorant) ----- */\n  --accent-lg:       28px;  /* \"Flavour built from real food…\" */\n  --track-accent:    0.06em;\n\n  /* ----- Body (Figtree) ----- */\n  --body-lg:         16px;\n  --body-md:         15px;\n  --body-sm:         13px;\n  --body-xs:         11px;\n  --line-body:       1.6;   /* @kind other */\n  --line-snug:       1.5;   /* @kind other */\n\n  /* ----- Eyebrow / label (Figtree, uppercase, wide track) ----- */\n  --eyebrow-size:    15px;\n  --eyebrow-sm:      13px;\n  --track-eyebrow:   0.24em;   /* MEET THE FOUNDER, WHAT'S ON THE TABLE? */\n  --track-wide:      0.16em;   /* buttons, nutrition tags */\n  --track-announce:  0.12em;   /* top-bar announcement */\n\n  /* ----- Button text ----- */\n  --btn-size:        14px;\n  --btn-size-sm:     13px;\n}\n\n/* Abby's Table — Spacing, radii, shadows, layout\n   4px base grid. Pills are fully rounded; cards use an 18px radius;\n   large media blocks use 24px. Shadows are minimal and warm. */\n\n:root {\n  /* ----- Spacing scale (4px grid) ----- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* Section vertical rhythm */\n  --section-pad-y: 96px;\n  --gutter:        80px;   /* page side gutter at 1440 */\n\n  /* ----- Radii ----- */\n  --radius-sm:    12px;\n  --radius-card:  18px;   /* dish cards, images */\n  --radius-lg:    24px;   /* hero media, founder image, big blocks */\n  --radius-pill:  999px;  /* buttons, filter chips, icon buttons */\n\n  /* ----- Borders ----- */\n  --border-hairline: 1px;\n  --rule-thick:      2px;  /* brass dividers */\n  --rule-brass-top:  3px;  /* top-bar brass line */\n\n  /* ----- Shadows (warm, restrained) ----- */\n  --shadow-card:  0 1px 2px rgba(59, 44, 34, 0.04), 0 8px 24px rgba(59, 44, 34, 0.06);\n  --shadow-raised:0 12px 40px rgba(21, 41, 31, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(194, 142, 60, 0.40);\n\n  /* ----- Layout ----- */\n  --content-max: 1280px;\n  --frame-max:   1440px;\n}\n\n<\u002Fstyle>\n<style>/* Abby's Table — focus standard (site-wide). Loaded by every live page; never re-declare per page.\n   1. CONTROLS: one shared :focus-visible ring — the design system's --shadow-focus (brass, 3px),\n      plus a transparent outline so Windows High Contrast / forced-colors still draws a ring.\n      :where() keeps specificity at zero, so a component that needs a different shape (e.g. an\n      inset ring inside a clipped card) can still refine it with an ordinary class rule.\n   2. NON-CONTROLS: elements given tabindex=\"-1\" only so script can move focus to them (a skip\n      target, a panel heading) are not controls and get NO ring. This is what stops the browser's\n      default blue outline appearing \"sometimes\" — :focus-visible on programmatic focus depends on\n      whether the customer last used the keyboard.\n   Focus outlines are never removed globally: rule 2 applies only to tabindex=\"-1\". */\n:where(a[href], button, input, select, textarea, summary, [contenteditable=\"true\"],\n  [role=\"button\"], [role=\"link\"], [role=\"radio\"], [role=\"checkbox\"], [role=\"switch\"],\n  [role=\"tab\"], [role=\"option\"], [role=\"menuitem\"], [role=\"combobox\"], [role=\"slider\"],\n  [tabindex]:not([tabindex=\"-1\"])):focus-visible {\n  outline: 2px solid transparent;\n  outline-offset: 2px;\n  box-shadow: var(--shadow-focus, 0 0 0 3px rgba(194, 142, 60, .4));\n}\n/* Controls whose box-shadow is owned by an inline style (a live value — elevation, a selected\n   state) cannot show the shared ring, because an inline declaration outranks any rule. They get\n   the same brass as a solid outline instead. !important only to beat page-level outline resets. */\n:where(a[href], button, input, select, textarea, [role=\"button\"], [role=\"radio\"])[style*=\"box-shadow\"]:focus-visible {\n  outline: 2px solid var(--focus-ring, #C28E3C) !important;\n  outline-offset: 2px;\n}\n[tabindex=\"-1\"]:focus, [tabindex=\"-1\"]:focus-visible { outline: none; box-shadow: none; }\n@media (forced-colors: active) {\n  :where(a[href], button, input, select, textarea, summary, [role], [tabindex]:not([tabindex=\"-1\"])):focus-visible { outline-color: Highlight; }\n}\n<\u002Fstyle>\n<script src=\"faa8ab70-c8d3-48d3-9cb7-9760cc5f3fc8\"><\u002Fscript>\n<script src=\"e5d99f36-2327-4ea7-a5c6-3b64c4ea78dc\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<!-- Order in progress: swaps \"Get started\" for VIEW BOX and the purchase bar for a box\n     summary once step 1 has been started. Self-initialising; no page-local code. -->\n<script src=\"c767cf56-ce25-45af-9307-954436a9b580\"><\u002Fscript>\n<!-- Signed in: \"Log in\" reads \"My Account\" in the header and drawer. Self-initialising. -->\n<script src=\"76937f35-5e23-4b61-920e-c31f8e7bc196\"><\u002Fscript>\n  <script src=\"77ef62ed-8411-457b-8733-40c8a035fda7\"><\u002Fscript>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; }\n    body { margin: 0; background: var(--cream); }\n    a { color: var(--green-forest); }\n    a:hover { color: var(--terracotta-deep); }\n    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 3px; }\n    /* Brass is only 1.9:1 on green-deep, so dark grounds get a cream ring with a gold outer edge. */\n    @keyframes at-drawer-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }\n    @keyframes at-fade-in { from { opacity: 0; } to { opacity: 1; } }\n    /* Closed with display: none rather than unmounted, so aria-controls always resolves. It also\n       keeps the drawer out of the accessibility tree and the tab order, and the animation replays\n       on each open because the element goes from display: none to displayed. */\n    .at-drawer-wrap { display: none; }\n    .at-drawer-wrap.is-open { display: block; }\n    .at-drawer-panel { animation: at-drawer-in .2s ease; }\n    .at-drawer-scrim { animation: at-fade-in .2s ease; }\n    /* Pending token refinement: --terracotta sampled from the approved mockup (#B7554E — the\n       shipped token #B45F5A carries more blue, which reads dull). Scoped to this page until\n       the header/CTA is approved, then it moves into the design system and this block goes. */\n    /* --gold is the bright accent sampled from the approved mockup (#F6C33B). DARK GROUNDS ONLY:\n       9.3:1 on green-deep, but 1.45:1 on cream and 1.63:1 under white text. --brass (#C28E3C)\n       stays the accent for light grounds until those sections are redesigned. */\n    /* --brass-ink is brass for SMALL TEXT on cream. --brass-deep (#A9762C) measures only 3.47:1\n       there, under the 4.5:1 small-text minimum; #8A5F1F measures 4.96:1 and still reads brass.\n       Use --brass for rules, hairlines and large marks; --brass-ink whenever brass is type. */\n    /* --chilli is the terracotta value quoted in the design system's own guide (#B8431C); the\n       shipped token has since drifted to a pinker #B45F5A, which at 15px pip size reads as rose\n       rather than heat. Graphic only, never type. 6.4:1 on the #EDE5D9 card panel. */\n    /* --sage is a new band ground, sampled from the approved Our standards mockup. Full-bleed\n       coloured bands are now sanctioned for specific sections (this one, Abby's Story, Private\n       Table) — they are NOT an invitation to alternate bands page-wide. Light ground: green-forest\n       reads 9.4:1 on it and brown 10.2:1, so all type is safe; brass is only 2.2:1, which is why\n       the icons use brass-ink (4.3:1) rather than brass or the hero's gold. */\n    :root { --terracotta: #B7554E; --terracotta-deep: #9C433D; --gold: #F6C33B; --brass-ink: #8A5F1F; --chilli: #B8431C; --sage: #E1E2D2; }\n\n    .at-nav-link:hover { color: var(--terracotta-deep) !important; border-bottom-color: var(--brass) !important; }\n    /* Current page. aria-current was already on the right link in every header but nothing styled\n       it, so on desktop there was no way to tell where you were. Three signals, not colour alone:\n       green-forest ink, semibold, and the brass underline made persistent — the same underline the\n       hover uses, so the language is one. Hover still wins over it, which is correct: the pointer\n       is reporting what it is over, not where you are. */\n    .at-nav-link[aria-current=\"page\"] { color: var(--green-forest) !important; font-weight: 600; border-bottom-color: var(--brass) !important; }\n    .at-login:hover { color: var(--terracotta-deep) !important; }\n    .at-login:hover span { border-bottom-color: var(--brass) !important; }\n    .at-drawer-link:hover { color: var(--brass) !important; }\n    /* No hover lift. The design system specifies fades and colour shifts, \"no bounces, no large\n       motion\", with press feedback as a slight colour deepen — the translateY(-1px) these three\n       carried came across from the old homepage and made them the only buttons on the page that\n       moved. Press is a deepen, per the system. */\n    .at-cta, .at-drawer-cta { transition: background .16s ease; }\n    .at-cta:hover, .at-drawer-cta:hover { background: var(--terracotta-deep) !important; }\n    .at-cta:active, .at-drawer-cta:active { background: var(--terracotta-deep) !important; filter: brightness(.94); }\n    @media (prefers-reduced-motion: reduce) {\n      .at-cta, .at-drawer-cta { transition: none !important; }\n    }\n    .at-logo { transition: opacity .16s ease; }\n    .at-logo:hover { opacity: .78; }\n    .at-burger span, .at-burger span span { transition: background .16s ease, border-color .16s ease; }\n    .at-burger:hover span { border-color: var(--terracotta-deep) !important; }\n    .at-burger:hover span span { background: var(--terracotta-deep) !important; }\n    .at-hdr { transition: transform .22s ease; }\n    .at-hdr[data-hidden=\"true\"] { transform: translateY(-100%); }\n    /* Footer. Mobile-first: the accordion IS the mobile design, and it is switched off at 1024\n       rather than built there and overridden down. All type on --green-deep clears AA: brass\n       5.2:1, green-sage 5.4:1, sand-2 9.9:1, blush ~12:1. */\n    /* Mobile footer is centred throughout. Input TEXT stays left-aligned — centred text in a\n       field jumps around as you type an email. */\n    .at-foot-news { text-align: center; }\n    /* The page head is centred as one unit, matching Contact and Terms of Sale. The body below\n       stays left-aligned — centring the allergen list and notices would hurt scanning. */\n    .at-a-hd { text-align: center; }\n    .at-foot-head { justify-content: center; }\n    .at-foot-link { justify-content: center; }\n    .at-foot-links { align-items: stretch; }\n    /* Smooth for the in-page jump to Opening hours, off for reduced motion. */\n    html { scroll-behavior: smooth; }\n    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n    /* Contact. One hover language, same as every rebuilt page: colour shift, never a fade, plus a\n       3px arrow nudge on links that carry one. Borders darken on hover, go green on focus. */\n    .at-arrow { display: inline-block; transition: transform .16s ease; }\n    /* One order at every width: Our approach, Need more help, Useful links. The mockup leads with\n       Need more help, but a flex `order` swap put visual and DOM order in disagreement below 1024\n       and both panels hold links — tab focus jumped 152px back up the page (WCAG 2.4.3). The three\n       panels are independent self-labelled peers, so DOM order is the order everywhere and the\n       sequence still reads as an escalation after the caveat: how we handle allergens, then a\n       person, then links. */\n    .at-aside { display: flex; flex-direction: column; gap: 30px; }\n    .at-a-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    .at-a-cta { background-color: var(--green-forest); transition: background-color .16s ease; }\n    .at-a-cta:hover { background-color: var(--green-deep); }\n    .at-a-cta:active { filter: brightness(.94); }\n    .at-a-cta:hover .at-arrow { transform: translateX(3px); }\n    .at-a-cta:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }\n    .at-tlink { transition: color .16s ease; }\n    .at-tlink:hover { color: var(--terracotta-deep) !important; }\n    .at-tlink:hover .at-arrow { transform: translateX(3px); }\n    .at-tlink:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }\n    @media (prefers-reduced-motion: reduce) {\n      .at-arrow, .at-tlink, .at-a-cta { transition: none !important; }\n      .at-arrow { transform: none !important; }\n    }\n    .at-foot-link { transition: color .16s ease; }\n    .at-foot-link:hover { color: var(--brass) !important; }\n    /* Anchor only: the legal strip has no buttons since Cookie preferences became a link.\n       Leaving the button selectors in place would be dead CSS, and their presence is what hid the\n       missing-hover bug the first time this control changed type. */\n    .at-foot-legal a:hover { color: var(--brass) !important; }\n    .at-foot-head { cursor: pointer; }\n    /* Collapsed state lives HERE, not inline: these links carry inline styles, and an inline\n       display would beat this rule (the accordion silently never closed). */\n    .at-foot-links { display: none; flex-direction: column; }\n    .at-foot-col.is-open .at-foot-links { display: flex; }\n    .at-foot-col.is-open .at-foot-chevron { transform: rotate(180deg); }\n    .at-foot-chevron { transition: transform .18s ease; }\n    /* Icon links shift fill like any other link — no fade. The presentation attribute fill on the\n       svg loses to CSS, so this wins without !important. */\n    .at-social svg { transition: fill .16s ease; }\n    .at-social:hover svg { fill: var(--brass); }\n    .at-foot-join { transition: background .16s ease; }\n    .at-foot-join:hover { background: var(--brass-deep) !important; }\n    .at-foot-join:active { filter: brightness(.94); }\n    .at-foot-input::placeholder { color: var(--green-sage); opacity: 1; }\n    /* Cream ring with a gold outer edge: brass is only 1.9:1 on green-deep, so a brass ring is\n       invisible here. Two crisp bands, not a glow — offset 0 so the cream sits flush against the\n       control and the gold reads as a hairline edge outside it rather than a halo. The outline\n       paints OVER the shadow, so the gold band is (spread - outline width) = 1px; a literal 2px\n       spread would hide the gold behind the cream entirely. Same values on hero, drawer, footer\n       and Private Table — one focus language, no per-control exceptions. */\n    .at-foot-inner a:focus-visible, .at-foot-inner button:focus-visible, .at-foot-input:focus-visible {\n      outline: 2px solid var(--cream); outline-offset: 0; box-shadow: 0 0 0 3px var(--gold);\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .at-foot-chevron, .at-foot-link, .at-foot-join, .at-social svg { transition: none !important; }\n    }\n\n    /* --- 640px: more measure, so the buttons sit side by side and copy widens --- */\n    @media (min-width: 640px) {\n      .at-hdr-row { padding: 14px 34px !important; gap: 14px !important; }\n      /* The combined pill only appears once the column is wide enough for it. At 320 it left the\n         input about 150px, which cannot show \"Enter your email address\". */\n      .at-foot-form { flex-direction: row !important; align-items: stretch !important; gap: 0 !important; height: 52px !important; width: 340px; max-width: 100%; border: 1px solid var(--green-mid); border-radius: var(--radius-pill); overflow: hidden; }\n      .at-foot-input { flex: 1 1 auto !important; min-width: 0 !important; border: none !important; border-radius: 0 !important; height: auto !important; }\n      .at-foot-join { border-radius: 0 !important; height: auto !important; width: auto !important; padding: 0 26px !important; }\n      .at-foot-inner { padding: 48px 34px 0 !important; }\n      .at-page-inner { padding: 0 34px !important; }\n      .at-asec { padding: 52px 0 56px !important; }\n      .at-a-list { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }\n      .at-a-cta { width: auto !important; }\n      .at-cta { font-size: 13px !important; letter-spacing: .1em !important; padding: 0 20px !important; }\n    }\n\n    /* --- 1024px: desktop composition — nav in the header, sidebar beside the main column --- */\n    @media (min-width: 1024px) {\n      .at-burger { display: none !important; }\n      .at-nav, .at-login { display: flex !important; }\n      .at-hdr-row { padding: 18px 48px !important; }\n      .at-logo { justify-self: start !important; }\n      .at-hdr-row { grid-template-columns: auto 1fr auto auto !important; gap: 34px !important; }\n      .at-login { margin-left: 12px !important; }\n\n      .at-foot-inner { padding: 56px 48px 0 !important; }\n      .at-page-inner { padding: 0 48px !important; }\n      .at-asec { padding: 60px 0 64px !important; }\n      .at-h1 { font-size: 56px !important; }\n      /* Two columns, both starting at the top: the h1 leads the left column rather than spanning\n         the page, so the sidebar sits level with it as in the mockup. */\n      .at-agrid { grid-template-columns: minmax(0, 1fr) 372px !important; gap: 56px !important; }\n      .at-aside { border-left: 1px solid var(--sand); padding-left: 56px; gap: 34px !important; }\n      .at-a-list { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }\n      .at-a-h2 { font-size: 48px !important; }\n      .at-a-note { font-size: 30px !important; }\n      .at-a-panel { padding: 30px 34px !important; }\n      .at-a-cta { width: auto !important; }\n      .at-foot-grid { grid-template-columns: 1.4fr 3fr !important; gap: 48px !important; }\n      .at-foot-cols { grid-template-columns: repeat(3, 1fr) !important; gap: 48px !important; }\n      /* Accordion off: every column open, heads are labels rather than controls. */\n      .at-foot-col { border-top: none !important; }\n      .at-foot-head { min-height: 0 !important; padding: 0 !important; cursor: default !important; }\n      .at-foot-chevron { display: none !important; }\n      .at-foot-links { display: flex !important; margin-top: 16px !important; padding-bottom: 0 !important; }\n      .at-foot-bottom { grid-template-columns: 1fr auto 1fr !important; align-items: center !important; }\n      /* DOM order IS the visual order at every width — logo → signature → follow — so keyboard\n         focus never runs backwards across the four social links and the logo link (WCAG 2.4.3).\n         Only ALIGNMENT changes at this breakpoint; placement never does. The three blocks used to\n         carry order: 1/2/3 with the follow row first in the DOM, which reversed the row here. */\n      .at-foot-logo { justify-self: start !important; }\n      .at-foot-follow { justify-self: end !important; align-items: flex-end !important; }\n      .at-foot-follow-row { flex-direction: row !important; align-items: center !important; gap: 12px !important; }\n      .at-foot-dash { display: inline !important; }\n      .at-foot-mark { width: 220px !important; height: 38px !important; }\n      .at-foot-legal { flex-direction: row !important; gap: 4px 24px !important; }\n      .at-foot-news { text-align: left !important; }\n      .at-foot-news p { max-width: 300px; }\n      .at-foot-consent { max-width: 340px; }\n      .at-foot-head { justify-content: space-between !important; }\n      .at-foot-link { justify-content: flex-start !important; }\n      .at-foot-legal-row { gap: 24px !important; }\n      .at-foot-legal-sep { display: none !important; }\n      .at-foot-rule { display: block !important; }\n      .at-foot-cols { border-bottom: none !important; }\n      .at-foot-bottom { margin-top: 0 !important; }\n    }\n\n    /* Breakpoint exception — min-width 1280. The method cards go 4-up only here, not at 1024:\n       four across at 1024 leaves 164px of text column, and the email address needs 208px at its\n       smallest sensible size. At 1280 the column is 228px. A content reason, not a device size. */\n  <\u002Fstyle>\n<style>\n  /* Sterling sign, site-wide. Playfair Display's £ has a double crossbar that reads as a euro, so\n     U+00A3 alone is drawn from a Figtree subset (1 KB, 400–700) prepended to the display and\n     accent stacks. Every other character is untouched. html:root outranks the token sheet. */\n  @font-face { font-family: \"AT Sterling\"; src: url(\"4fc0ad59-c7f2-4505-8807-c44373fd509c\") format(\"woff2\"); font-weight: 400 700; font-style: normal; font-display: block; unicode-range: U+00A3; }\n  html:root {\n    --font-display: \"AT Sterling\", \"Playfair Display\", ui-serif, Georgia, \"Times New Roman\", serif;\n    --font-accent: \"AT Sterling\", \"Cormorant Garamond\", ui-serif, Georgia, serif;\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header class=\"at-hdr\" ref=\"{{ hdrRef }}\" data-hidden=\"{{ hdrHidden }}\" style=\"position: sticky; top: 0; z-index: 60; background: var(--cream-2); border-bottom: 1px solid var(--sand);\">\n  <div class=\"at-hdr-row\" style=\"display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; max-width: 1280px; margin: 0 auto; padding: 10px 14px;\">\n\n    <button class=\"at-burger\" type=\"button\" ref=\"{{ burgerRef }}\" sc-camel-on-click=\"{{ openDrawer }}\" aria-label=\"Open menu\" aria-controls=\"at-drawer\" aria-expanded=\"{{ burgerExpanded }}\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; border: none; background: transparent; cursor: pointer;\">\n      <span aria-hidden=\"true\" style=\"display: block; width: 22px; height: 14px; border-top: 1.6px solid var(--green-forest); border-bottom: 1.6px solid var(--green-forest); position: relative;\"><span style=\"position: absolute; left: 0; right: 0; top: 50%; margin-top: -0.8px; height: 1.6px; background: var(--green-forest);\"><\u002Fspan><\u002Fspan>\n    <\u002Fbutton>\n\n    <a class=\"at-logo\" href=\"Abby's Table - Homepage v2.dc.html\" aria-label=\"Abby's Table — home\" style=\"justify-self: center; display: block; text-decoration: none; min-width: 0;\">\n      <span aria-hidden=\"true\" style=\"display: block; width: clamp(108px, 36vw, 168px); aspect-ratio: 186 / 32; color: var(--green-forest);\"><at-wordmark><\u002Fat-wordmark><\u002Fspan>\n    <\u002Fa>\n\n    <nav class=\"at-nav\" aria-label=\"Main\" style=\"display: none; justify-self: center; align-items: center; gap: 30px;\">\n      <a class=\"at-nav-link\" href=\"Abby's Table - Menu Landing v3.dc.html\" style=\"font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: color .16s ease, border-color .16s ease;\">Menu<\u002Fa>\n      <a class=\"at-nav-link\" href=\"Abby's Table - How It Works v2.dc.html\" style=\"font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: color .16s ease, border-color .16s ease;\">How it works<\u002Fa>\n      <a class=\"at-nav-link\" href=\"Abby's Table - Abby's Story v2.dc.html\" style=\"font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: color .16s ease, border-color .16s ease;\">Abby’s Story<\u002Fa>\n      <a class=\"at-nav-link\" href=\"Abby's Table - Gifting v2.dc.html\" style=\"font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: color .16s ease, border-color .16s ease;\">Gifting<\u002Fa>\n      <a class=\"at-nav-link\" href=\"Abby's Table - Private Table v2.dc.html\" style=\"font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: color .16s ease, border-color .16s ease;\">Private Table<\u002Fa>\n    <\u002Fnav>\n\n    <a class=\"at-login\" href=\"Abby's Table - Log in.dc.html\" style=\"display: none; align-items: center; height: 44px; font-family: var(--font-sans); font-size: 15px; color: var(--brown); text-decoration: none; white-space: nowrap; transition: color .16s ease;\"><span style=\"display: inline-block; padding-bottom: 2px; border-bottom: 1.5px solid transparent; transition: border-color .16s ease;\">Log in<\u002Fspan><\u002Fa>\n\n    <a class=\"at-cta\" href=\"Abby's Table - Choose Box v2.dc.html\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 13px; border-radius: var(--radius-pill); background: var(--terracotta); color: #fff; font-family: var(--font-sans); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; white-space: nowrap;\">Get started<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- Allergens. An information page like Delivery & FAQs and Contact: no hero, no mobile purchase\n     bar. Header, drawer and footer are copied verbatim from the canonical homepage v2.\n     ALL SAFETY COPY IS PLACEHOLDER and needs sign-off before launch — the cross-contamination\n     statement and every operational claim under \"Our approach\" (build-handoff.md § Open items).\n     The 14 are the UK regulated list, presented as a plain <ul>: not links, not buttons, no icons\n     and no chevrons — there is no per-allergen destination, and a chevron on something inert is a\n     promise the page cannot keep. -->\n<main>\n  <section class=\"at-asec\" style=\"padding: 34px 0 48px;\">\n    <div class=\"at-page-inner\" style=\"max-width: 1280px; margin: 0 auto; padding: 0 22px;\">\n      <div class=\"at-agrid\" style=\"display: grid; gap: 30px;\">\n\n        <div>\n          <h1 class=\"at-h1 at-a-hd\" style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: clamp(38px, 11.6vw, 56px); line-height: 1.04; letter-spacing: -0.015em; color: var(--green-forest);\">Allergens<\u002Fh1>\n          <p class=\"at-a-hd\" style=\"margin: 12px auto 0; max-width: 560px; font-family: var(--font-sans); font-size: 18px; line-height: 1.5; color: var(--brown); text-wrap: pretty;\">We take allergens seriously and follow strict procedures in our kitchen. This page provides information about the 14 major allergens used in our dishes.<\u002Fp>\n\n          <h2 class=\"at-a-h2\" style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: clamp(30px, 8.6vw, 40px); line-height: 1.08; letter-spacing: -0.01em; color: var(--green-forest); margin-top: 34px;\">The 14 major allergens<\u002Fh2>\n          <p style=\"margin: 10px 0 0; max-width: 560px; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">Our dishes may contain, or be prepared in an environment where the following allergens are present.<\u002Fp>\n\n          <ul class=\"at-a-list\" style=\"display: grid; gap: 10px; margin: 20px 0 0; padding: 0; list-style: none;\">\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Celery<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Cereals containing gluten<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Crustaceans<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Eggs<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Fish<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Lupin<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Milk<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Molluscs<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Mustard<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Nuts<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Peanuts<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Sesame<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Soya<\u002Fli>\n          <li style=\"display: flex; align-items: center; min-height: 56px; background: var(--cream-2); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.35; color: var(--green-forest); text-wrap: pretty;\">Sulphur dioxide and sulphites<\u002Fli>\n          <\u002Ful>\n\n          <!-- The legally load-bearing notice on the page. Its own --blush panel so it cannot be\n               read as supporting copy, and every point stated in words rather than relying on the\n               icon. At this length the label is a real heading rather than a 13px eyebrow, so it\n               takes an <h2> at the panel-heading size.\n               Emphasis marks the ACTION in each paragraph — what the reader must do, or the limit\n               of what they may assume — so it is semantic <strong>, not bold for weight. The final\n               line is a legal backstop rather than an instruction, so a hairline and --taupe set it\n               apart from the six actionable paragraphs above.\n               Copy is the client's, verbatim; still awaiting food-safety sign-off\n               (build-handoff.md § Open items). -->\n          <div class=\"at-a-panel\" style=\"margin-top: 26px; background: var(--blush); border-radius: 18px; padding: 24px 22px;\">\n            <div style=\"display: flex; align-items: center; gap: 13px;\">\n              <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--brass-ink)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: 0 0 auto;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v5.5M12 7.6h.01\"><\u002Fpath><\u002Fsvg>\n              <h2 class=\"at-a-note\" style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 22px; line-height: 1.2; color: var(--green-forest); text-wrap: pretty;\">Important allergen information<\u002Fh2>\n            <\u002Fdiv>\n            <p style=\"margin: 18px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\"><strong style=\"font-weight: 600; color: var(--green-forest);\">Allergens contained in each dish are clearly identified on our website before you order and provided again with your food when it is delivered.<\u002Fstrong> Recipes, ingredients and suppliers can change, so please check the current allergen information for every dish when ordering and check the information supplied with your delivery again before eating. This is especially important if you are ordering for someone else.<\u002Fp>\n            <p style=\"margin: 18px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">We have procedures in place to manage allergens and reduce the risk of unintended cross-contact. However, different allergens are handled within our kitchen. Where our allergen risk assessment identifies an unavoidable risk of cross-contact that cannot be adequately controlled, we will clearly identify the specific allergen using appropriate precautionary wording, such as <strong style=\"font-weight: 600; color: var(--green-forest);\">“may contain [allergen]”<\u002Fstrong>. Precautionary warnings are based on assessed risk and are not used as a substitute for good food-safety practices.<\u002Fp>\n            <p style=\"margin: 18px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">Unless a product is expressly described as <strong style=\"font-weight: 600; color: var(--green-forest);\">free from<\u002Fstrong> a particular allergen, you should not assume that it is suitable for someone who needs to completely avoid that allergen. Terms such as <strong style=\"font-weight: 600; color: var(--green-forest);\">vegan, vegetarian or plant-led do not mean allergen-free.<\u002Fstrong><\u002Fp>\n            <p style=\"margin: 18px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\"><strong style=\"font-weight: 600; color: var(--green-forest);\">If you have a food allergy or intolerance, please review the allergen information carefully before placing your order. If anything is unclear, or you have a severe allergy or specific concern, <a class=\"at-tlink\" href=\"Abby's Table - Contact Us.dc.html\" style=\"color: var(--green-forest); text-decoration: underline; text-underline-offset: 3px;\">contact us<\u002Fa> before ordering.<\u002Fstrong><\u002Fp>\n            <p style=\"margin: 18px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\"><strong style=\"font-weight: 600; color: var(--green-forest);\">If the allergen information supplied with your delivery differs from information you previously viewed online, or if a label is missing, damaged or unclear, do not eat the dish until you have contacted us and we have confirmed the information.<\u002Fstrong><\u002Fp>\n            <p style=\"margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--brass); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">Nothing in this notice limits Abby’s Table’s responsibilities under food-safety or consumer law.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Sidebar on desktop; a continuation of the page on mobile, in the SAME order at both.\n             After the caveat it reads as an escalation: how we handle allergens, then the route to\n             a person, then the links. The mockup leads with \"Need more help\", and it was built\n             that way first with a flex `order` swap below 1024 — but that desynced visual and DOM\n             order and both panels hold links, so tab focus jumped back up the page. DOM order\n             wins; do not reintroduce the swap at either breakpoint.\n             The Contact CTA is 52px — a major section CTA, matching \"Still need help\" on\n             Delivery & FAQs. Filled rather than outline per the mockup; the height is the ladder's,\n             not the panel's. -->\n        <div class=\"at-aside\">\n          <div>\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 22px; line-height: 1.2; color: var(--green-forest);\">Our approach<\u002Fh2>\n            <p style=\"margin: 10px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">We follow strict food safety procedures, including separate storage, careful preparation and thorough cleaning. Our team is trained to manage allergens responsibly.<\u002Fp>\n            <p style=\"margin: 12px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">If you’re unsure whether a dish is suitable for you, please ask us.<\u002Fp>\n            <\u002Fdiv>\n\n          <div>\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 22px; line-height: 1.2; color: var(--green-forest);\">Need more help?<\u002Fh2>\n            <p style=\"margin: 10px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.6; color: var(--brown); text-wrap: pretty;\">If you have a specific allergy or dietary requirement, please get in touch before placing an order.<\u002Fp>\n            <div style=\"display: flex; margin-top: 16px;\">\n              <a class=\"at-a-cta\" href=\"Abby's Table - Contact Us.dc.html\" style=\"display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 28px; border-radius: var(--radius-pill); color: var(--cream); font-family: var(--font-sans); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none;\"><span>Contact us<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 22px; line-height: 1.2; color: var(--green-forest);\">Useful links<\u002Fh2>\n            <ul style=\"display: grid; gap: 12px; margin: 14px 0 0; padding: 0; list-style: none;\">\n            <li style=\"background: var(--cream-2); border: 1px solid var(--sand); border-radius: 14px; padding: 16px 18px;\">\n              <p style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 19px; line-height: 1.2; color: var(--green-forest);\">Allergen information by dish<\u002Fp>\n              <p style=\"margin: 5px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; color: var(--brown); text-wrap: pretty;\">Check allergens for each dish on our menu.<\u002Fp>\n              <a class=\"at-tlink\" href=\"Abby's Table - Menu Landing v3.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-ink); text-decoration: none;\"><span style=\"border-bottom: 1px solid var(--brass); padding-bottom: 1px;\">View the menu<\u002Fspan><span class=\"at-arrow\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n            <\u002Fli>\n            <li style=\"background: var(--cream-2); border: 1px solid var(--sand); border-radius: 14px; padding: 16px 18px;\">\n              <p style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 19px; line-height: 1.2; color: var(--green-forest);\">FAQs<\u002Fp>\n              <p style=\"margin: 5px 0 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.5; color: var(--brown); text-wrap: pretty;\">Find answers to common questions about allergens, ingredients and more.<\u002Fp>\n              <a class=\"at-tlink\" href=\"Abby's Table - Delivery and FAQs.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-ink); text-decoration: none;\"><span style=\"border-bottom: 1px solid var(--brass); padding-bottom: 1px;\">Browse our FAQ<span style=\"text-transform: lowercase;\">s<\u002Fspan><\u002Fspan><span class=\"at-arrow\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n            <\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- Footer. Becomes the canonical shared footer on approval.\n     Dropped from the old version: \"Journal\" and \"Discovery Box\" (no such pages), and the 1440\n     shell (this is on the 1280 grid like every other band). Added: legal links, and a consent\n     line on the signup, which previously collected an email with no lawful basis stated.\n     FOUR DESTINATIONS DO NOT EXIST YET — Contact us, Allergens, Privacy Policy, Terms. They stay\n     on #contact rather than pointing at files that would 404. Delivery & FAQs is now wired. -->\n<footer id=\"contact\" ref=\"{{ footRef }}\" style=\"background: var(--green-deep);\">\n  <div aria-hidden=\"true\" style=\"height: 2px; background: var(--brass);\"><\u002Fdiv>\n  <div class=\"at-foot-inner\" style=\"max-width: 1280px; margin: 0 auto; padding: 40px 22px 0;\">\n\n    <div class=\"at-foot-grid\" style=\"display: grid; gap: 36px;\">\n      <div class=\"at-foot-news\">\n        <p style=\"margin: 0; font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass);\">Join the table<\u002Fp>\n        <p style=\"margin: 12px 0 18px; font-family: var(--font-sans); font-size: 16px; line-height: 1.55; color: var(--blush);\">Kitchen notes and offers from Abby, monthly.<\u002Fp>\n\n        <sc-if value=\"{{ subscribed }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 0; font-family: var(--font-display); font-weight: var(--weight-medium); font-size: 22px; line-hei
